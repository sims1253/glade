name: PR Size

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  label:
    name: Label PR by size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Count changed lines
        id: diff
        run: |
          # Merge base for PRs, or HEAD~1 for pushes
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD~1"
          fi

          CHANGED=$(git diff --stat "$BASE" -- ':(exclude)*.lock' ':(exclude)*.lockb' ':(exclude)**/dist/**' | tail -1)
          LINES=$(echo "$CHANGED" | awk 'match($0, /([0-9]+) insertion/) {print substr($0, RSTART, RLENGTH)}' | awk '{print $1}')
          DELETIONS=$(echo "$CHANGED" | awk 'match($0, /([0-9]+) deletion/) {print substr($0, RSTART, RLENGTH)}' | awk '{print $1}')
          LINES=${LINES:-0}
          DELETIONS=${DELETIONS:-0}
          TOTAL=$((LINES + DELETIONS))
          echo "lines=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Determine size label
        id: size
        run: |
          LINES="${{ steps.diff.outputs.lines }}"
          if [ "$LINES" -lt 20 ]; then
            echo "label=size:S" >> "$GITHUB_OUTPUT"
          elif [ "$LINES" -lt 100 ]; then
            echo "label=size:M" >> "$GITHUB_OUTPUT"
          elif [ "$LINES" -lt 500 ]; then
            echo "label=size:L" >> "$GITHUB_OUTPUT"
          else
            echo "label=size:XL" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply label
        uses: actions/github-script@v7
        with:
          script: |
            const label = '${{ steps.size.outputs.label }}';
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              core.info('No PR number found, skipping.');
              return;
            }

            // Remove existing size labels
            const existing = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const sizeLabels = existing.data
              .filter((l) => l.name.startsWith('size:'))
              .map((l) => l.name);

            for (const old of sizeLabels) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: old,
              }).catch(() => {});
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: [label],
            });
