name: ci

on:
  push:
    branches:
      - master
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Cache Bun and Turbo
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-${{ hashFiles('turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes librsvg2-bin imagemagick
          if ! command -v magick >/dev/null 2>&1; then
            sudo ln -sf "$(command -v convert)" /usr/local/bin/magick
          fi
          magick --version

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(bun x playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Effect diagnostics
        run: bun run diagnostics:effect

      - name: Test (Unit)
        run: bun run test

      - name: Install Playwright Chromium
        run: |
          cd apps/web
          bun x playwright install --with-deps chromium

      - name: Test (Browser)
        run: bun run test:browser

      - name: Build
        run: bun run build

      - name: Build Desktop Bundle
        run: bun run build:desktop-bundle

      - name: Test (Desktop Smoke)
        run: bun run test:desktop-smoke

      - name: Verify Artifacts
        run: |
          test -f apps/web/dist/index.html
          test -f apps/desktop/dist-electron/main.cjs
          test -f apps/desktop/dist-electron/preload.cjs
          test -f apps/server/dist/index.mjs

      - name: Assert Bridge Strings in Preload
        run: |
          grep -q "glade:select-file-path" apps/desktop/dist-electron/preload.cjs
          grep -q "glade:get-update-state" apps/desktop/dist-electron/preload.cjs

  release_smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Cache Bun and Turbo
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-${{ hashFiles('turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes librsvg2-bin imagemagick
          if ! command -v magick >/dev/null 2>&1; then
            sudo ln -sf "$(command -v convert)" /usr/local/bin/magick
          fi
          magick --version

      - name: Release smoke
        run: bun run release:smoke

  integration:
    runs-on: ubuntu-latest
    needs:
      - validate
      - release_smoke

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - uses: r-lib/actions/setup-r@v2

      - name: Cache Bun and Turbo
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-${{ hashFiles('turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install R build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libcurl4-openssl-dev

      - name: Install the legacy bridge dependency pair
        shell: bash
        run: |
          Rscript -e 'install.packages("pak", repos = "https://cloud.r-project.org")'
          # Bayesgrove 0.5.1 and dagriculture 0.1.6 still expose this client's APIs.
          # Current Bayesgrove is intentionally rejected by desktop preflight.
          Rscript -e 'pak::pkg_install(c("sims1253/dagriculture@5faf5e47d1d8b65f38e42477278b2195e151b6ff", "sims1253/bayesgrove@64d8f0c8f1714fb009a3539d802cf06e12ab0958"), dependencies = NA)'

      - name: Server integration tests
        run: bun run --cwd apps/server test:integration
